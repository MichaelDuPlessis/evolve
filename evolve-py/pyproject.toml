[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "evolve-rs"
version = "0.1.0"
requires-python = ">=3.9"
description = "High-performance evolutionary algorithms in Python, powered by Rust"
license = { text = "MIT" }
authors = [{ name = "Michael du Plessis" }]
keywords = ["genetic-algorithm", "evolutionary", "optimization", "grammatical-evolution"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[tool.maturin]
python-source = "python"
module-name = "evolve._evolve"
features = []
bindings = "pyo3"
